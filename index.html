<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Autos de Lujo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
</head>

<body class="bg-light">

<!-- HERO -->
<section class="hero text-white text-center d-flex align-items-center justify-content-center mb-4">
  <div class="container">
    <h1 class="display-4">Conduce el Lujo</h1>
    <p class="lead">Explora nuestra colección exclusiva de autos de lujo.</p>
    <a href="#productos" class="btn btn-primary btn-lg">Ver Autos</a>
  </div>
</section>

<!-- CONTENEDOR DE PRODUCTOS -->
<div class="container py-4" id="productos">
  <h1 class="text-center mb-4">Autos de Lujo</h1>

  <div class="row">
    <!-- Productos -->
    <div class="col-md-8">
      <div class="row g-3">
        <!-- Card Auto 1 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/ferrari.jpg" class="card-img-top auto-img" alt="Ferrari SF90">
            <div class="card-body">
              <h5 class="card-title">Ferrari SF90</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Ferrari SF90')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 2 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/lamborghini.jpg" class="card-img-top auto-img" alt="Lamborghini Aventador">
            <div class="card-body">
              <h5 class="card-title">Lamborghini Aventador</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Lamborghini Aventador')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 3 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/rolls.jpg" class="card-img-top auto-img" alt="Rolls Royce Phantom">
            <div class="card-body">
              <h5 class="card-title">Rolls-Royce Phantom</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Rolls-Royce Phantom')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 4 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/bugatti.jpg" class="card-img-top auto-img" alt="Bugatti Chiron">
            <div class="card-body">
              <h5 class="card-title">Bugatti Chiron</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Bugatti Chiron')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 5 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/mclaren.jpg" class="card-img-top auto-img" alt="McLaren P1">
            <div class="card-body">
              <h5 class="card-title">McLaren P1</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('McLaren P1')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 6 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/porsche.jpg" class="card-img-top auto-img" alt="Porsche 911 Turbo S">
            <div class="card-body">
              <h5 class="card-title">Porsche 911 Turbo S</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Porsche 911 Turbo S')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 7 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/aston.jpg" class="card-img-top auto-img" alt="Aston Martin DBS">
            <div class="card-body">
              <h5 class="card-title">Aston Martin DBS</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Aston Martin DBS')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 8 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/bentley.jpg" class="card-img-top auto-img" alt="Bentley Continental GT">
            <div class="card-body">
              <h5 class="card-title">Bentley Continental GT</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Bentley Continental GT')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 9 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/mercedes.jpg" class="card-img-top auto-img" alt="Mercedes AMG GT">
            <div class="card-body">
              <h5 class="card-title">Mercedes AMG GT</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('Mercedes AMG GT')">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Card Auto 10 -->
        <div class="col-md-4">
          <div class="card">
            <img src="https://ecommerceleo.blob.core.windows.net/imagenesleo/bmw.jpg" class="card-img-top auto-img" alt="BMW i8">
            <div class="card-body">
              <h5 class="card-title">BMW i8</h5>
              <button class="btn btn-lujo w-100" onclick="agregarProducto('BMW i8')">Comprar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Carrito -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-dark text-white">Carrito</div>
        <ul class="list-group list-group-flush" id="lista-carrito">
          <li class="list-group-item text-muted text-center">No hay autos</li>
        </ul>
        <div class="card-footer text-center">
          <button class="btn btn-eliminar" onclick="eliminarProducto()">Eliminar último auto</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="JS/script.js"></script>
</body>
</html>
